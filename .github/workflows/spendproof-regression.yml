name: SpendProof regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KILN_API_KEY: ''
      TESTNET_PRIVATE_KEY: ''
      ENABLE_TESTNET_ANCHOR: 'false'
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Test rules, synthetic boundaries, SDK and secret isolation
        run: npm test
      - name: Type-check project
        run: npx tsc --noEmit
      - name: Type-check standalone SDK example
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node examples/sdk-regression.ts
      - name: Run reviewed SDK regression example
        run: node --import tsx examples/sdk-regression.ts
      - name: Build without loading integration environment files
        run: |
          node --input-type=module -e 'import { build } from "vite"; await build({ envDir: false });'
